[project]
name = "learn-llms"
version = "0.1.0"
description = "Learn LLMs in 2 hours: hands-on scripts from tokenizers to GPT-2 and BERT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch (>=2.15.0,<3.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "transformers (>=5.22.2,<6.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
